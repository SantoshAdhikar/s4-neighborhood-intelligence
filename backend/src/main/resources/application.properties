
spring.application.name=s4-neighborhood-intelligence

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/s4_neighborhood_intelligence
spring.datasource.username=s4_neighborhood_app
spring.datasource.password=${S4_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Storefront media: stored outside the repository by default.
s4.media.root=${S4_MEDIA_DIR:${user.home}/.s4-neighborhood-media}
s4.media.max-bytes=${S4_MEDIA_MAX_BYTES:26214400}
s4.media.max-analysis-attempts=${S4_MEDIA_ANALYSIS_ATTEMPTS:2}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB

# Real Meta Model API; no key or model outputs are committed to Git.
s4.meta.base-url=${S4_META_BASE_URL:https://api.meta.ai/v1}
s4.meta.model=${S4_META_MODEL:muse-spark-1.3}
s4.meta.api-key=${MODEL_API_KEY:}
s4.meta.file-expiry-seconds=${S4_META_FILE_EXPIRY_SECONDS:3600}
